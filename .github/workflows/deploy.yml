name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          REACT_APP_EMAILJS_LEAD_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_LEAD_TEMPLATE_ID }}
          REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
          REACT_APP_MEDIA_BASE_URL: ${{ secrets.REACT_APP_MEDIA_BASE_URL }}
        run: npm run build

      - name: Validate deployment secrets
        env:
          HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET != '' }}
        run: |
          if [ "$HAS_AWS_ACCESS_KEY_ID" != "true" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID secret. Add it as a repository secret or as a secret in the Production environment."
            exit 1
          fi
          if [ "$HAS_AWS_SECRET_ACCESS_KEY" != "true" ]; then
            echo "::error::Missing AWS_SECRET_ACCESS_KEY secret. Add it as a repository secret or as a secret in the Production environment."
            exit 1
          fi
          if [ "$HAS_AWS_S3_BUCKET" != "true" ]; then
            echo "::error::Missing AWS_S3_BUCKET secret. Add it as a repository secret or as a secret in the Production environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed assets to S3
        run: |
          aws s3 sync build/ "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "manifest.json" \
            --exclude "robots.txt" \
            --exclude "asset-manifest.json"

      - name: Sync entry files to S3
        run: |
          aws s3 sync build/ "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "index.html" \
            --include "manifest.json" \
            --include "robots.txt" \
            --include "asset-manifest.json"

      - name: Publish route entrypoints
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: npm run publish-routes

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "AWS_CLOUDFRONT_DISTRIBUTION_ID not set; skipping invalidation."
          fi
